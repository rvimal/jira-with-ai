[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-with-ai"
version = "0.1.0"
description = "Scheduled Jira workflow driven by an LLM and MCP servers"
requires-python = ">=3.11"

[project.scripts]
jira-with-ai = "app.main:main"

[tool.setuptools]
packages = [
  "app",
  "app.llm",
  "app.mcp",
  "app.orchestrator",
  "app.prompts",
  "app.utils",
  "app.workflows",
]